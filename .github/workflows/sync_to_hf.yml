name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  # 手動実行用ボタン（任意）
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://YOUR_USER_NAME:$HF_TOKEN@huggingface.co/spaces/YOUR_USER_NAME/YOUR_SPACE_NAME main
