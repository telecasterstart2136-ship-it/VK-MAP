name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Exclude images and sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 画像拡張子を Git 追跡から外す設定を作成
          echo "*.jpg export-ignore" >> .gitattributes
          echo "*.jpeg export-ignore" >> .gitattributes
          echo "*.png export-ignore" >> .gitattributes
          echo "*.gif export-ignore" >> .gitattributes
          
          # 画像ファイルを除外した一時ブランチを作成して Push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy-hf
          git rm -r --cached "*.jpg" "*.jpeg" "*.png" "*.gif" || true
          git commit -m "Exclude images for HF sync" || true
          git push --force "https://telecasterstart2136-ship-it:$HF_TOKEN@huggingface.co/spaces/Wakaba0991/VK-map" main
